name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
          cache-read-only: false

      - name: Verify project and build environment
        shell: bash
        run: |
          set -e
          test -f settings.gradle.kts || test -f settings.gradle
          test -d app
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0|ndk;27.2.12479018' || true

      # Do not use ./gradlew here. The repository intentionally uses the
      # Gradle distribution installed above, so a missing wrapper cannot
      # prevent a valid Android build.
      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle assembleDebug --stacktrace --info -Pandroid.ndkVersion=${ANDROID_NDK_VERSION}

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: USB-Print-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
